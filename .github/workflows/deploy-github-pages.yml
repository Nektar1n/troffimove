# После push в main: сборка и публикация на GitHub Pages.
# В репозитории: Settings → Pages → Source: «GitHub Actions».

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Один секрет DOTENV = весь текст локального .env (имя «.env» для секрета в GitHub нельзя).
      # Vite подхватит файл при npm run build.
      - name: Собрать .env из секрета DOTENV
        env:
          DOTENV: ${{ secrets.DOTENV }}
        run: |
          if [ -n "$DOTENV" ]; then
            printf '%s\n' "$DOTENV" > .env
            echo "OK: записан .env из секрета DOTENV"
          else
            echo "Секрет DOTENV пуст — сборка без переменных из .env (как локально без файла)"
          fi

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
