  <body class="is-booting">
    <!-- Показывается сразу, до загрузки JS — чтобы не мелькал футер -->
    <div id="site-boot" class="site-boot" role="status" aria-live="polite" aria-busy="true" aria-label="Загрузка сайта">
      <div class="site-boot__inner">
        <img class="site-boot__logo" src="/logo.svg" width="939" height="401" alt="Troffimove Auto" />
        <div class="site-boot__bar" aria-hidden="true">
          <span class="site-boot__bar-fill"></span>
        </div>
        <p class="site-boot__hint">Загрузка…</p>
      </div>
    </div>
    <style>
      body.is-booting {
        overflow: hidden;
      }

      .site-boot {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f5f1e9;
        color: #2d2c2c;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      .site-boot.site-boot--done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .site-boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.35rem;
        width: min(100%, 16rem);
      }

      .site-boot__logo {
        display: block;
        width: min(100%, 11.5rem);
        height: auto;
        animation: site-boot-logo 1.1s ease-in-out infinite alternate;
      }

      .site-boot__bar {
        width: 100%;
        height: 3px;
        border-radius: 999px;
        background: rgba(45, 44, 44, 0.12);
        overflow: hidden;
      }

      .site-boot__bar-fill {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #e9be5f;
        animation: site-boot-bar 1.05s ease-in-out infinite;
      }

      .site-boot__hint {
        margin: 0;
        font-family: Inter, Onest, system-ui, sans-serif;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(45, 44, 44, 0.55);
      }

      @keyframes site-boot-logo {
        from {
          opacity: 0.72;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes site-boot-bar {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .site-boot__logo,
        .site-boot__bar-fill {
          animation: none;
        }

        .site-boot__logo {
          opacity: 1;
        }

        .site-boot__bar-fill {
          width: 100%;
          transform: none;
        }
      }
    </style>
    <div id="app"></div>
    <script>
      /* Если JS не поднялся — не держим лоадер вечно */
      window.setTimeout(function () {
        var boot = document.getElementById('site-boot');
        if (!boot || boot.classList.contains('site-boot--done')) return;
        document.body.classList.remove('is-booting');
        boot.classList.add('site-boot--done');
        window.setTimeout(function () {
          boot.remove();
        }, 700);
      }, 15000);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
